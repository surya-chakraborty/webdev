<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>fetch example</title>
</head>
<body>
    <div id="root">
        <!-- Just a simple example of fetch api -->
    </div>
    <button onclick="fetchPosts()"> Fetch Posts </button>
    <script>
        async function fetchPosts(){
            const res = await fetch('https://jsonplaceholder.typicode.com/posts/1')
            const data = await res.json()
            document.querySelector('#root').innerHTML = data.title
        }

        async function corseExperiment(){
            const res = await fetch('http://localhost:3000/sum?a=2&b=3')
            const result = await res.json()
            console.log(result)
            document.querySelecto('#root').innerHTML = result
        }

        corseExperiment()
        // fetchPosts()
    </script>
</body>
</html>
